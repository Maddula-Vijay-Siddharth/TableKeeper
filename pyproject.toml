[project]
name = "tablekeeper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maddula-Vijay-Siddharth", email = "maddulavijaysiddharth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "band-sdk[codex]>=4.0.0",
    "fastapi>=0.118.0",
    "psycopg[binary]>=3.2.10",
    "pydantic-settings>=2.10.1",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.37.0",
]

[project.scripts]
tablekeeper = "tablekeeper:main"
tablekeeper-api = "tablekeeper.cli:main"
tablekeeper-migrate = "tablekeeper.migrate:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "tablekeeper-band",
    "reviewer-band",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]
